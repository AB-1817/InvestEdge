name: Backend CI & Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.yml"
      - "conftest.py"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.yml"
      - "conftest.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for GCP Workload Identity Federation

jobs:
  lint-and-typecheck:
    name: Lint (Ruff) & Type-Check (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies & linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ --select E9,F63,F7,F82

      - name: Type-check with MyPy (Lenient)
        run: |
          mypy backend/ --ignore-missing-imports --no-strict-optional --allow-redefinition || true

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest
        env:
          GROQ_API_KEY: "mock_test_key"
          INVESTEDGE_DB_PATH: "data/ci_investedge.db"
        run: |
          mkdir -p data
          python -m pytest backend/tests backend/backtesting/tests -v --tb=short

  eval-gate:
    name: Model & Retrieval Evaluation Gate (Phase 5)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Evaluation Harness in Mock Mode (CI Quality Gate)
        run: |
          python -m backend.evals.run --mock --dataset backend/evals/golden.jsonl --output evals/results/latest.json --summary evals/results/latest.md

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          tags: investedge-backend:ci-check

